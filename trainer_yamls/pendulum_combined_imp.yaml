# Environment
environment:
 name: "PendulumSim"
 gravity: 9.8
 mass1: 1.0
 length: 0.0
 dt: 0.01
 max_action: 10.0
 damping: 0.0
 seed: 42

# Data Collection Parameters
collector:
  num_trajectories: 500
  episode_time: 1000
  policy_seed: 35
  save: false
  impulse_policy: true

datasets:
  use_existing: true
  regime: "combined"
  paths:
    - "datasets/impulse_policy/v0_PendulumSim_*.npz"

# Model Parameterrs
model:
  seed: 0
  run_model: true
  name: "WorldModelRSSM"
  state_dim: 3
  action_dim: 1
  hidden_dim: 64
  latent_dim: 8

# Training and Testing Parameters
trainer:
  run_trainer: true
  batch_size: 256
  steps: 100000
  log_interval: 100
# Visualizer Parameters

# Rollout Engine
rollout_engine:
  run_rollouts: False
  horizon: 1


# Hyperparameters
hyperparams:
  lam: 1.0
  reg: false
  optimizer: Adam
  loss: MSE
  lr: 0.001
  rollout_decay: "Linear"
  gamma: 0.9
  rollout_steps: 50
  beta: 0.1
  

checkpointing:
  save: true
  save_path: "model_saves_rssm"
  load: False
  load_path: null
  logbase_dir: "logfiles_rssm"

settings:
  device: "cpu"
