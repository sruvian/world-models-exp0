# Environment
environment:

  name: "CartPoleSim"
  gravity: 0
  mass1: 0.1
  mass2: 1.0
  length: 10.0
  dt: 0.01
  max_action: 10.0
  damping: 0.0
  seed: 42
# Data Collection
collector:
  num_trajectories: 500
  episode_time: 1000
  policy_seed: 35
  save: false
  impulse_policy: true
# Datasets
datasets:
  use_existing: true
  regime: "holdl"
  paths:
    - "datasets/impulse_policy/*_CartPoleSim_*length10*.npz"
# Model
model:
  seed: 0
  run_model: true
  name: "WorldModelRSSM"
  state_dim: 5
  action_dim: 1
  hidden_dim: 64
  latent_dim: 8
# Trainer
trainer:
  run_trainer: true
  batch_size: 256
  steps: 100000
  log_interval: 100
# Rollout Engine
rollout_engine:
  run_rollouts: False
  horizon: 50
  zero_actions: False
# Hyperparameters
hyperparams:
  lam: 1.0
  reg: false
  optimizer: Adam
  loss: MSE
  lr: 0.001
  rollout_steps: 50
  rollout_decay: "Linear"
  gamma: 0.9
  beta: 0.1
# Checkpointing
checkpointing:
  save: true
  save_path: "model_saves_rssm"
  load: False
  load_path: null
  logbase_dir: "logfiles_rssm"
# Settings
settings:
  device: "cpu"